<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sokoban Pack</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #14151c; color: #d7d9e0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header { padding: 14px 16px 4px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 1px; }
  #levelbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 8px 16px; max-width: 900px; }
  #levelbar button {
    background: #23252f; color: #aeb2c0; border: 1px solid #34374a; border-radius: 4px;
    padding: 4px 9px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #levelbar button.current { background: #3a4a6b; color: #fff; border-color: #5b74a8; }
  #levelbar button.done { border-color: #3f7a4a; color: #7fce8d; }
  #stage { position: relative; margin: 10px; }
  canvas { display: block; background: #0d0e13; border-radius: 6px; box-shadow: 0 6px 30px #0009; transition: filter .25s ease; }
  canvas.dead { filter: grayscale(1) brightness(.55); }
  #banner.dead { background: #0005; font-size: 18px; color: #e8e8f0; letter-spacing: 1px; }
  #banner {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: #000a; border-radius: 6px; font-size: 26px; letter-spacing: 2px; color: #ffe97a;
    text-align: center; flex-direction: column; gap: 10px;
  }
  #banner small { font-size: 13px; color: #cfd2dc; letter-spacing: 0; }
  #hud { font-size: 12px; color: #8b8fa0; padding: 2px 16px 10px; text-align: center; }
  #hud b { color: #c9ccda; }
  details { max-width: 760px; margin: 4px 16px 24px; font-size: 12px; color: #9a9eb0; width: min(92vw, 760px); }
  details pre { white-space: pre-wrap; background: #1b1d26; padding: 10px; border-radius: 6px; }
  summary { cursor: pointer; color: #b9bdcc; }
  /* EMBED mode (?embed=1 or #embed): the page is one board inside someone else's chrome — no title, no key
     hints, no pack blurb, transparent background; the level bar stays unless ?bar=0 (a tutorial day shows it). */
  body.embed { background: transparent; min-height: 0; }
  body.embed header, body.embed #hud, body.embed #packinfo { display: none !important; }   /* !important: #packinfo gets an inline display when the pack has a blurb */
  body.embed #stage { margin: 4px; }
  body.embed.nobar #levelbar { display: none; }
</style>
</head>
<body>
<header><h1 id="title">SOKOBAN</h1></header>
<div id="levelbar"></div>
<div id="stage">
  <canvas id="cv" width="600" height="480"></canvas>
  <div id="banner"></div>
</div>
<div id="hud">

</div>
<details id="packinfo" style="display:none">
  <summary>Mechanics in this pack</summary>
  <pre id="packdesc"></pre>
</details>
